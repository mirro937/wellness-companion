services:
  # ---------------------------------------------------------------------------
  # 1. NestJS Backend API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rafiqak-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - SMS_GATEWAY_API_KEY=${SMS_GATEWAY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rafiqak-network

  # ---------------------------------------------------------------------------
  # 2. PostgreSQL 16 (with pg_trgm & Arabic fuzzy search support)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rafiqak-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rafiqak_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rafiqak_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-rafiqak_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rafiqak_admin} -d ${POSTGRES_DB:-rafiqak_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rafiqak-network

  # ---------------------------------------------------------------------------
  # 3. Redis 7.2 (OTP rate limiting, caching, session whitelist)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: rafiqak-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secure_pass_2026}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rafiqak-network

  # ---------------------------------------------------------------------------
  # 4. MinIO (Local S3 compatible storage for meal photos in development)
  #    In production, this is swapped seamlessly with Cloudflare R2 or AWS S3
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: rafiqak-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_secure_key_2026}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    networks:
      - rafiqak-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  rafiqak-network:
    driver: bridge
